<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我很棒了</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e; --border: #2a2a2a;
    --text: #e8e0d4; --text-dim: #6b6560; --text-mid: #9e9690;
    --morning: #e8c97a; --night: #8ab4c9; --bonus: #b48ee8;
    --affirm: #8ec9a0; --gratitude: #c9a08e; --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Serif TC', serif; min-height: 100dvh; overflow-x: hidden; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 20px 100px; }

  header { padding: 48px 0 16px; display: flex; flex-direction: column; gap: 4px; }
  .date-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
  h1 { font-size: 24px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.3; }
  .page-subtitle { font-size: 17px; font-weight: 300; margin-top: 2px; opacity: 0.8; }

  /* Day tabs */
  .tabs { display: flex; gap: 8px; margin: 20px 0 18px; background: var(--surface); border-radius: 12px; padding: 5px; }
  .tab { flex: 1; padding: 10px; border: none; border-radius: 9px; background: transparent; color: var(--text-dim); font-family: 'Noto Serif TC', serif; font-size: 14px; cursor: pointer; transition: all 0.25s; }
  .tab.active { background: var(--surface2); }
  .tab.morning.active { color: var(--morning); }
  .tab.night.active { color: var(--night); }

  .section { display: none; }
  .section.visible { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
  .card-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; }
  .card.bonus-card { border-color: rgba(180,142,232,0.2); background: rgba(180,142,232,0.04); }
  .card.bonus-card .card-label { color: rgba(180,142,232,0.5); }
  .card.affirm-card { border-color: rgba(142,201,160,0.2); background: rgba(142,201,160,0.04); }
  .card.affirm-card .card-label { color: rgba(142,201,160,0.5); }
  .card.gratitude-card { border-color: rgba(201,160,142,0.2); background: rgba(201,160,142,0.04); }
  .card.gratitude-card .card-label { color: rgba(201,160,142,0.5); }
  .card.reflect-card { border-color: rgba(138,180,201,0.15); background: rgba(138,180,201,0.03); }
  .card.reflect-card .card-label { color: rgba(138,180,201,0.45); }
  .card.closing-card { border-color: rgba(232,224,212,0.1); }
  .card.closing-card .card-label { color: rgba(232,224,212,0.3); }

  .task-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .task-row:last-child { margin-bottom: 0; }
  .task-num { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--morning); min-width: 18px; opacity: 0.7; }
  .task-num.bonus { color: var(--bonus); }
  .task-num.gratitude { color: var(--gratitude); opacity: 0.8; }
  .task-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Noto Serif TC', serif; font-size: 15px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .task-input::placeholder { color: var(--text-dim); font-size: 14px; }
  .task-input:focus { border-color: var(--morning); }
  .task-input.bonus-input:focus { border-color: var(--bonus); }
  .task-input.affirm-input:focus { border-color: var(--affirm); }
  .task-input.gratitude-input:focus { border-color: var(--gratitude); }

  .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-family: 'Noto Serif TC', serif; font-size: 16px; cursor: pointer; letter-spacing: 0.03em; transition: all 0.2s; margin-top: 8px; }
  .btn-morning { background: var(--morning); color: #1a1500; }
  .btn-night { background: var(--night); color: #091520; }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .done-selector { display: flex; gap: 8px; margin: 6px 0 2px; }
  .done-btn { flex: 1; padding: 12px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); color: var(--text-mid); font-size: 14px; font-family: 'Noto Serif TC', serif; cursor: pointer; transition: all 0.2s; text-align: center; }
  .done-btn.selected { border-color: var(--night); color: var(--night); background: rgba(138,180,201,0.08); }
  .done-btn.bonus-done-btn.selected { border-color: var(--bonus); color: var(--bonus); background: rgba(180,142,232,0.08); }

  .mood-selector { display: flex; gap: 6px; margin: 6px 0 2px; }
  .mood-btn { flex: 1; padding: 10px 2px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); cursor: pointer; transition: all 0.2s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mood-btn .mood-emoji { font-size: 22px; }
  .mood-btn .mood-label { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; }
  .mood-btn.selected { border-color: var(--text-mid); background: rgba(232,224,212,0.06); }
  .mood-btn.selected .mood-label { color: var(--text-mid); }

  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-family: 'Noto Serif TC', serif; font-size: 15px; outline: none; resize: none; min-height: 80px; transition: border-color 0.2s; -webkit-appearance: none; }
  textarea:focus { border-color: var(--night); }
  textarea.reflect-ta:focus { border-color: rgba(138,180,201,0.5); }
  textarea.closing-ta:focus { border-color: rgba(232,224,212,0.3); }
  textarea::placeholder { color: var(--text-dim); font-size: 14px; }

  .morning-ref { background: rgba(232,201,122,0.04); border: 1px solid rgba(232,201,122,0.12); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .morning-ref .ref-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: rgba(232,201,122,0.4); text-transform: uppercase; margin-bottom: 10px; }
  .morning-ref .ref-affirm { font-size: 13px; color: rgba(142,201,160,0.7); font-style: italic; margin-bottom: 10px; padding: 6px 10px; background: rgba(142,201,160,0.05); border-radius: 8px; border-left: 2px solid rgba(142,201,160,0.25); }
  .morning-ref .ref-task { font-size: 14px; color: rgba(232,201,122,0.75); padding: 3px 0; display: flex; gap: 10px; }
  .morning-ref .ref-task span { opacity: 0.5; font-family: 'DM Mono', monospace; font-size: 12px; }
  .morning-ref .ref-task.bonus-ref { color: rgba(180,142,232,0.75); }
  .morning-ref .ref-divider { height: 1px; background: rgba(232,201,122,0.08); margin: 10px 0; }
  .morning-ref .bonus-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: rgba(180,142,232,0.4); text-transform: uppercase; margin-bottom: 8px; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 12px; text-align: center; }
  .result-score { font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; margin-bottom: 8px; }
  .result-score.morning { color: var(--morning); }
  .result-score.night { color: var(--night); }
  .result-msg { font-size: 15px; color: var(--text-mid); line-height: 1.6; margin-bottom: 14px; }
  .result-mood { font-size: 26px; margin-bottom: 8px; }
  .result-note { font-size: 13px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 14px; line-height: 1.8; text-align: left; }
  .result-note-row { padding: 3px 0; display: flex; gap: 8px; align-items: flex-start; }
  .result-note-icon { opacity: 0.6; flex-shrink: 0; }

  /* ── Log ── */
  .log-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .log-summary { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .log-summary-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; flex: 1; }
  .log-summary-meta { display: flex; align-items: center; gap: 8px; }
  .log-summary-mood { font-size: 16px; }
  .log-summary-score { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--night); }
  .log-summary-arrow { font-size: 11px; color: var(--text-dim); transition: transform 0.2s; }
  .log-entry.open .log-summary-arrow { transform: rotate(180deg); }
  .log-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .log-entry.open .log-body { display: block; }
  .log-affirm { font-size: 13px; color: rgba(142,201,160,0.7); font-style: italic; margin: 12px 0 8px; padding: 5px 10px; background: rgba(142,201,160,0.05); border-radius: 6px; border-left: 2px solid rgba(142,201,160,0.2); }
  .log-tasks { margin-bottom: 8px; }
  .log-task { font-size: 13px; color: var(--text-mid); padding: 2px 0; display: flex; gap: 10px; align-items: flex-start; }
  .log-task .n { color: var(--morning); font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6; margin-top: 2px; flex-shrink: 0; }
  .log-task .nb { color: var(--bonus); font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6; margin-top: 2px; flex-shrink: 0; }
  .log-night-section { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; }
  .log-night-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .log-score { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--night); }
  .log-detail { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .log-detail-row { display: flex; gap: 6px; padding: 1px 0; }
  .log-detail-icon { flex-shrink: 0; opacity: 0.5; }
  .log-edit-btn { margin-top: 12px; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text-dim); font-family: 'Noto Serif TC', serif; font-size: 13px; cursor: pointer; }
  .log-incomplete { font-size: 12px; color: var(--text-dim); opacity: 0.5; font-style: italic; padding-top: 8px; }

  /* ── Week Review ── */
  .week-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .week-header { padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .week-label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-mid); letter-spacing: 0.08em; }
  .week-meta { display: flex; align-items: center; gap: 8px; }
  .week-days { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .week-arrow { font-size: 11px; color: var(--text-dim); transition: transform 0.2s; }
  .week-card.open .week-arrow { transform: rotate(180deg); }
  .week-body { display: none; border-top: 1px solid var(--border); padding: 16px 18px; }
  .week-card.open .week-body { display: block; }
  .week-stat-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .week-stat { flex: 1; text-align: center; background: var(--surface2); border-radius: 10px; padding: 12px 6px; }
  .week-stat-num { font-family: 'DM Mono', monospace; font-size: 22px; margin-bottom: 3px; }
  .week-stat-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .week-mood-row { display: flex; gap: 4px; margin-bottom: 14px; justify-content: flex-start; }
  .week-mood-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .week-mood-emoji { font-size: 18px; }
  .week-mood-day { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); }
  .week-section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .week-affirm-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
  .week-affirm-item { font-size: 13px; color: rgba(142,201,160,0.8); font-style: italic; padding: 5px 10px; background: rgba(142,201,160,0.05); border-radius: 7px; border-left: 2px solid rgba(142,201,160,0.2); }
  .week-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .week-keyword { font-size: 12px; color: var(--gratitude); background: rgba(201,160,142,0.08); border: 1px solid rgba(201,160,142,0.2); border-radius: 20px; padding: 4px 10px; }
  /* AI 回饋 */
  .ai-btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Noto Serif TC', serif; font-size: 13px; color: var(--bonus); background: rgba(232,201,122,0.08); border: 1px solid rgba(232,201,122,0.28); border-radius: 10px; padding: 9px 14px; cursor: pointer; transition: all 0.15s; }
  .ai-btn:active { transform: scale(0.97); }
  .ai-btn:disabled { opacity: 0.5; cursor: default; }
  .ai-box { font-size: 13.5px; line-height: 1.85; color: var(--text-mid); background: rgba(232,201,122,0.05); border: 1px solid rgba(232,201,122,0.18); border-left: 2px solid rgba(232,201,122,0.5); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; }
  .ai-box-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .ai-redo { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 2px 0; }
  .ai-loading { font-size: 13px; color: var(--text-dim); font-style: italic; padding: 4px 2px; }
  @keyframes pulse { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

  .empty-log { text-align: center; color: var(--text-dim); font-size: 14px; padding: 48px 0; line-height: 1.8; }

  /* ── Edit Sheet ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; backdrop-filter: blur(4px); }
  .overlay.visible { display: block; }
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; max-height: 92dvh; background: var(--bg); border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); z-index: 101; overflow-y: auto; padding: 0 20px 40px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); }
  .sheet.visible { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 14px auto 18px; }
  .sheet-title { font-size: 15px; font-weight: 300; color: var(--text-mid); margin-bottom: 16px; text-align: center; }
  .sheet-tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--surface); border-radius: 12px; padding: 5px; }
  .sheet-tab { flex: 1; padding: 9px; border: none; border-radius: 9px; background: transparent; color: var(--text-dim); font-family: 'Noto Serif TC', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .sheet-tab.active { background: var(--surface2); }
  .sheet-tab.morning.active { color: var(--morning); }
  .sheet-tab.night.active { color: var(--night); }
  .sheet-section { display: none; }
  .sheet-section.visible { display: block; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px 22px; border-radius: 50px; font-size: 14px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13,13,13,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; padding: 10px 0 20px; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); font-family: 'Noto Serif TC', serif; font-size: 11px; cursor: pointer; padding: 6px 0; transition: color 0.2s; }
  .nav-btn .icon { font-size: 20px; }
  .nav-btn.active { color: var(--text); }
  .nav-btn.today.active { color: var(--morning); }
  .nav-btn.week.active { color: var(--bonus); }
  .nav-btn.habit.active { color: #7dd4a8; }

  /* Habit page */
  .habit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
  .habit-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .habit-emoji-big { font-size: 26px; }
  .habit-info { flex: 1; }
  .habit-name { font-size: 15px; color: var(--text); margin-bottom: 2px; }
  .habit-freq-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; }
  .habit-delete { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px; opacity: 0.5; }
  .habit-week-dots { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
  .habit-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: 'DM Mono', monospace; border: 1.5px solid var(--border); color: var(--text-dim); transition: all 0.2s; flex-shrink: 0; cursor: pointer; }
  .habit-dot.done { background: #7dd4a8; border-color: #7dd4a8; color: #0d2a1e; font-size: 14px; }
  .habit-dot.today-dot { border-color: #7dd4a8; color: #7dd4a8; }
  .habit-dot.future-dot { opacity: 0.25; cursor: default; }
  .habit-progress-row { display: flex; align-items: center; gap: 8px; }
  .habit-progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .habit-progress-fill { height: 100%; background: #7dd4a8; border-radius: 2px; transition: width 0.4s ease; }
  .habit-progress-text { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); min-width: 36px; text-align: right; }
  .habit-streak { font-size: 11px; color: var(--morning); }
  .emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .emoji-btn { font-size: 22px; padding: 8px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface2); cursor: pointer; transition: all 0.15s; }
  .emoji-btn.selected { border-color: #7dd4a8; background: rgba(125,212,168,0.1); }
  .freq-selector { display: flex; gap: 8px; }
  .freq-btn { flex: 1; padding: 10px 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); color: var(--text-mid); font-family: 'Noto Serif TC', serif; font-size: 13px; cursor: pointer; text-align: center; transition: all 0.2s; }
  .freq-btn.selected { border-color: #7dd4a8; color: #7dd4a8; background: rgba(125,212,168,0.08); }
  .freq-num-input { width: 60px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 16px; text-align: center; outline: none; -webkit-appearance: none; }
  .btn-habit { background: #7dd4a8; color: #0d2a1e; }
  .night-habit-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .night-habit-row:last-child { border-bottom: none; }
  .night-habit-emoji { font-size: 20px; }
  .night-habit-name { flex: 1; font-size: 14px; color: var(--text-mid); }
  .night-habit-check { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
  .night-habit-check.checked { background: #7dd4a8; border-color: #7dd4a8; }

  .hint { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-bottom: 14px; padding: 11px 13px; background: var(--surface2); border-radius: 10px; }
  .hint em { color: var(--morning); font-style: normal; }
  .hint em.bonus { color: var(--bonus); }

  /* ── 補登記按鈕 ── */
  .log-add-btn { width: 100%; padding: 14px; border: 1px dashed var(--border); border-radius: 12px; background: var(--surface2); color: var(--text-mid); font-family: 'Noto Serif TC', serif; font-size: 15px; cursor: pointer; margin-bottom: 16px; transition: all 0.2s; }
  .log-add-btn:active { transform: scale(0.99); opacity: 0.9; }

  /* ── 共用月曆 ── */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); color: var(--text-mid); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .cal-nav-btn:active { transform: scale(0.95); }
  .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-title { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--text); letter-spacing: 0.05em; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); text-align: center; padding: 4px 0 6px; }
  .cal-cell { aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-mid); border: 1px solid transparent; transition: all 0.15s; position: relative; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.pickable { cursor: pointer; background: var(--surface2); border-color: var(--border); }
  .cal-cell.pickable:active { transform: scale(0.94); }
  .cal-cell.future { opacity: 0.25; }
  .cal-cell.clickable { cursor: pointer; }
  .cal-cell.clickable:active { transform: scale(0.94); opacity: 0.8; }
  .cal-cell.today { border-color: var(--morning); color: var(--morning); }
  .cal-cell.has-record::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--night); }
  /* 習慣熱力圖等級 */
  .cal-cell.heat-1 { background: rgba(125,212,168,0.18); color: #9fe3c4; }
  .cal-cell.heat-2 { background: rgba(125,212,168,0.38); color: #d4f5e6; }
  .cal-cell.heat-3 { background: rgba(125,212,168,0.62); color: #0d2a1e; }
  .cal-cell.heat-4 { background: rgba(125,212,168,0.9); color: #0d2a1e; font-weight: 600; }
  .cal-cell .heat-num { font-size: 12px; }
  .cal-cell .heat-badge { position: absolute; top: 2px; right: 3px; font-family: 'DM Mono', monospace; font-size: 8px; line-height: 1; padding: 1px 3px; border-radius: 6px; background: rgba(13,42,30,0.35); color: inherit; }
  .cal-cell.heat-1 .heat-badge, .cal-cell.heat-2 .heat-badge { background: rgba(13,42,30,0.45); color: #d4f5e6; }

  /* ── 習慣完整紀錄頁 ── */
  .hp-back { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-mid); font-family: 'Noto Serif TC', serif; font-size: 14px; cursor: pointer; padding: 6px 0; margin-bottom: 8px; }
  .hp-legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 14px; padding: 0 2px; }
  .hp-legend-item { display: flex; align-items: center; gap: 4px; }
  .hp-legend-box { width: 14px; height: 14px; border-radius: 4px; }
  .hp-habit-list { margin-top: 4px; }
  .hp-habit-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); padding: 3px 0; }
  .hp-month-summary { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header id="mainHeader">
    <div class="date-label" id="dateLabel"></div>
    <h1>我很棒了 ✨</h1>
    <div class="page-subtitle" id="pageSubtitle"></div>
  </header>
  <div class="tabs" id="dayTabs" style="display:none">
    <button class="tab morning active" id="tabMorning" onclick="switchDayTab('morning')">🌞 早上</button>
    <button class="tab night" id="tabNight" onclick="switchDayTab('night')">🌙 晚上</button>
  </div>
  <div class="section visible" id="todaySection"><div id="todayContent"></div></div>
  <div class="section" id="habitSection"><div id="habitContent"></div></div>
  <div class="section" id="logSection"><div id="logContent"></div></div>
  <div class="section" id="weekSection"><div id="weekContent"></div></div>
  <div class="section" id="habitHistorySection"><div id="habitHistoryContent"></div></div>
</div>

<nav class="nav">
  <button class="nav-btn today active" id="navToday" onclick="showPage('today')"><span class="icon">☀️</span>今日</button>
  <button class="nav-btn habit" id="navHabit" onclick="showPage('habit')"><span class="icon">🌿</span>習慣</button>
  <button class="nav-btn" id="navLog" onclick="showPage('log')"><span class="icon">📖</span>紀錄</button>
  <button class="nav-btn week" id="navWeek" onclick="showPage('week')"><span class="icon">🗓</span>週回顧</button>
</nav>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="editSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle"></div>
  <div class="sheet-tabs">
    <button class="sheet-tab morning active" id="sheetTabMorning" onclick="switchSheetTab('morning')">🌞 早上</button>
    <button class="sheet-tab night" id="sheetTabNight" onclick="switchSheetTab('night')">🌙 晚上</button>
  </div>
  <div class="sheet-section visible" id="sheetMorning"></div>
  <div class="sheet-section" id="sheetNight"></div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="datePickerOverlay" onclick="closeDatePicker()"></div>
<div class="sheet" id="datePickerSheet" style="z-index:201;">
  <div class="sheet-handle"></div>
  <div class="sheet-title">選一天補登記</div>
  <div id="datePickerCal"></div>
  <div class="hint" style="margin-top:4px;">點任一天即可編輯那天的紀錄 ✍️</div>
</div>

<script>
const MOODS = [
  { emoji: '😔', label: '很低落' },
  { emoji: '😕', label: '有點累' },
  { emoji: '😐', label: '還好' },
  { emoji: '🙂', label: '不錯' },
  { emoji: '😄', label: '很好！' },
];
const DAYS_ZH = ['日','一','二','三','四','五','六'];
// ⬇⬇⬇ 部署好 Cloudflare Worker 後，把網址填到這裡（例如 https://xxx.workers.dev）⬇⬇⬇
const AI_ENDPOINT = 'https://daily-checkin-ai.emilyloas.workers.dev/';

let currentPage = 'today';
let currentDayTab = 'morning';
let selectedDone = null, selectedBonusDone = null, selectedMood = null;
let editingKey = null, editSelectedDone = null, editSelectedBonusDone = null, editSelectedMood = null;

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getFormattedDate() {
  const d = new Date();
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日　週${DAYS_ZH[d.getDay()]}`;
}
function formatDateLabel(key) {
  const [y,m,d] = key.split('-');
  const date = new Date(+y,+m-1,+d);
  return `${y}-${m}-${d}　週${DAYS_ZH[date.getDay()]}`;
}
function getWeekStart(dateKey) {
  const [y,m,d] = dateKey.split('-').map(Number);
  const date = new Date(y,m-1,d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; } }
function saveData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function getAllLogs() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('day_')) keys.push(k); }
  return keys.sort().reverse().map(k => ({ key: k.replace('day_',''), ...loadData(k) }));
}
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Page routing ──
function showPage(page) {
  currentPage = page;
  document.getElementById('habitHistorySection').classList.remove('visible');
  document.getElementById('mainHeader').style.display = '';
  ['today','habit','log','week'].forEach(p => document.getElementById(p+'Section').classList.toggle('visible', p===page));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById({today:'navToday',habit:'navHabit',log:'navLog',week:'navWeek'}[page]).classList.add('active');
  const tabs = document.getElementById('dayTabs');
  const subtitle = document.getElementById('pageSubtitle');
  if (page === 'today') {
    tabs.style.display = 'flex';
    subtitle.textContent = currentDayTab === 'morning' ? '毋須追憶昨日' : '深呼吸，放輕鬆';
    subtitle.style.color = currentDayTab === 'morning' ? 'rgba(232,201,122,0.85)' : 'rgba(138,180,201,0.85)';
    renderToday();
  } else {
    tabs.style.display = 'none';
    if (page === 'habit') { subtitle.textContent = ''; renderHabit(); }
    if (page === 'log') { subtitle.textContent = ''; renderLog(); }
    if (page === 'week') { subtitle.textContent = ''; renderWeek(); }
  }
}

function switchDayTab(tab) {
  currentDayTab = tab;
  document.getElementById('tabMorning').classList.toggle('active', tab==='morning');
  document.getElementById('tabNight').classList.toggle('active', tab==='night');
  const subtitle = document.getElementById('pageSubtitle');
  subtitle.textContent = tab === 'morning' ? '毋須追憶昨日' : '深呼吸，放輕鬆';
  subtitle.style.color = tab === 'morning' ? 'rgba(232,201,122,0.85)' : 'rgba(138,180,201,0.85)';
  renderToday();
}

function renderToday() {
  if (currentDayTab === 'morning') renderMorning();
  else renderNight();
}

// ── Morning ──
function renderMorning() {
  const today = getTodayKey();
  const existing = loadData('day_' + today);
  const el = document.getElementById('todayContent');
  if (existing && existing.tasks) {
    const bonusHtml = existing.bonusTasks && existing.bonusTasks.filter(Boolean).length > 0
      ? `<div style="height:8px"></div><div style="font-family:DM Mono,monospace;font-size:10px;letter-spacing:0.1em;color:rgba(180,142,232,0.5);text-transform:uppercase;margin-bottom:6px;">加分任務</div>${existing.bonusTasks.filter(Boolean).map((t,i)=>`<div style="padding:3px 0;color:rgba(180,142,232,0.75);font-size:13px;"><span style="font-family:DM Mono,monospace;font-size:12px;margin-right:10px;opacity:0.5;">+${i+1}</span>${t}</div>`).join('')}` : '';
    const affirmHtml = existing.affirmation ? `<div style="font-size:13px;color:rgba(142,201,160,0.8);font-style:italic;margin-bottom:10px;padding:6px 10px;background:rgba(142,201,160,0.05);border-radius:8px;border-left:2px solid rgba(142,201,160,0.25);">「${existing.affirmation}」</div>` : '';
    el.innerHTML = `<div class="result-card">
      <div class="result-score morning">✓</div>
      <div class="result-msg">今天的任務已設定好了</div>
      <div class="result-note">${affirmHtml}${existing.tasks.map((t,i)=>`<div style="padding:3px 0;color:var(--text-mid);font-size:13px;"><span style="color:var(--morning);font-family:DM Mono,monospace;font-size:12px;margin-right:10px;">${i+1}</span>${t}</div>`).join('')}${bonusHtml}</div>
    </div>
    <div class="hint">想修改嗎？點下方「重新設定」。</div>
    <button class="btn" style="background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);" onclick="resetMorning()">重新設定</button>`;
  } else {
    el.innerHTML = `<div class="hint">先給自己一個 <em>肯定</em>，再設定今天的 <em>底線任務</em>。<br>狀況好的話加上 <em class="bonus">加分任務</em> 🌟</div>
    <div class="card affirm-card">
      <div class="card-label">💚 對自己說一句肯定的話</div>
      <div class="task-row"><input class="task-input affirm-input" id="affirmInput" type="text" placeholder="我今天很勇敢、我已經很努力了…" maxlength="60"></div>
    </div>
    <div class="card">
      <div class="card-label">底線任務（完成就算今天成功）</div>
      ${[1,2,3].map(i=>`<div class="task-row"><span class="task-num">${i}</span><input class="task-input" id="task${i}" type="text" placeholder="今天一定要完成的事…" maxlength="40"></div>`).join('')}
    </div>
    <div class="card bonus-card">
      <div class="card-label">✦ 加分任務（選填）</div>
      ${[1,2].map(i=>`<div class="task-row"><span class="task-num bonus">+${i}</span><input class="task-input bonus-input" id="bonus${i}" type="text" placeholder="如果還有餘力…" maxlength="40"></div>`).join('')}
    </div>
    <button class="btn btn-morning" onclick="saveMorning()">出發 🌞</button>`;
  }
}

function saveMorning() {
  const tasks = [1,2,3].map(i => document.getElementById('task'+i).value.trim());
  if (!tasks.filter(Boolean).length) { showToast('至少填一個底線任務吧 🙂'); return; }
  const affirmation = document.getElementById('affirmInput').value.trim();
  const bonusTasks = [1,2].map(i => document.getElementById('bonus'+i).value.trim());
  const today = getTodayKey();
  const existing = loadData('day_'+today) || {};
  saveData('day_'+today, { ...existing, affirmation, tasks, bonusTasks, morningTime: new Date().toISOString() });
  showToast('✨ 今天的目標設定完成！');
  renderMorning();
}

function resetMorning() {
  const today = getTodayKey(); const existing = loadData('day_'+today) || {};
  delete existing.affirmation; delete existing.tasks; delete existing.bonusTasks; delete existing.morningTime;
  saveData('day_'+today, existing); renderMorning();
}

// ── Night ──
function renderNight() {
  const today = getTodayKey();
  const existing = loadData('day_'+today) || {};
  const el = document.getElementById('todayContent');
  if (existing.closingNote !== undefined) {
    el.innerHTML = buildNightResult(existing) + `<div class="hint">今天已經結算囉。好好休息 🌙</div><button class="btn" style="background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);" onclick="resetNight()">重新結算</button>`;
    return;
  }
  el.innerHTML = buildNightForm(existing, 'main') + `<button class="btn btn-night" onclick="saveNight()">深呼吸，結束今天 🌙</button>`;
  selectedDone = null; selectedBonusDone = null; selectedMood = null;
  setTimeout(renderNightHabits, 50);
}

function buildNightResult(data) {
  const msgs = ['今天能存在就很好，明天繼續。','完成了一件，這就是進步。','兩件打勾，表現很好！','三件全完成，今天很強。'];
  const moodData = data.mood !== undefined ? MOODS[data.mood] : null;
  const gHtml = data.gratitude && data.gratitude.filter(Boolean).length > 0
    ? data.gratitude.filter(Boolean).map(g=>`<div class="result-note-row"><span class="result-note-icon">🙏</span><span>${g}</span></div>`).join('') : '';
  return `<div class="result-card">
    ${moodData?`<div class="result-mood">${moodData.emoji}</div>`:''}
    <div class="result-score night">${data.done}<span style="font-size:22px;color:var(--text-dim)">/3</span>${data.bonusDone>0?`<span style="font-size:18px;color:var(--bonus);margin-left:8px;">+${data.bonusDone}</span>`:''}</div>
    <div class="result-msg">${msgs[data.done]||''}</div>
    <div class="result-note">
      ${gHtml}
      ${data.reflection?`<div class="result-note-row"><span class="result-note-icon">🔍</span><span>${data.reflection}</span></div>`:''}
      ${data.closingNote?`<div class="result-note-row" style="margin-top:6px;"><span class="result-note-icon">💬</span><span style="font-style:italic;">「${data.closingNote}」</span></div>`:''}
    </div>
  </div>`;
}

function buildNightForm(existing, prefix) {
  const hasBonusTasks = existing.bonusTasks && existing.bonusTasks.filter(Boolean).length > 0;
  const bonusCount = hasBonusTasks ? existing.bonusTasks.filter(Boolean).length : 0;
  let morningRef = existing.tasks
    ? `<div class="morning-ref"><div class="ref-label">今天早上</div>${existing.affirmation?`<div class="ref-affirm">「${existing.affirmation}」</div>`:''
      }${existing.tasks.map((t,i)=>`<div class="ref-task"><span>${i+1}</span>${t||'（未填）'}</div>`).join('')
      }${hasBonusTasks?`<div class="ref-divider"></div><div class="bonus-label">加分任務</div>${existing.bonusTasks.filter(Boolean).map((t,i)=>`<div class="ref-task bonus-ref"><span>+${i+1}</span>${t}</div>`).join('')}`:''}</div>`
    : `<div class="hint" style="margin-bottom:12px;">今天沒有設定早上任務，但還是可以結算 🙂</div>`;
  const p = prefix;
  const fn = p==='main' ? 'selectDone' : 'editSelectDone';
  const fnB = p==='main' ? 'selectBonusDone' : 'editSelectBonusDone';
  const fnM = p==='main' ? 'selectMood' : 'editSelectMood';
  return `${morningRef}
    <div class="card"><div class="card-label">完成幾個底線任務？</div>
      <div class="done-selector">${[0,1,2,3].map(n=>`<button class="done-btn" id="${p}doneBtn${n}" onclick="${fn}(${n})">${n}<br><span style="font-size:10px;opacity:0.5">${n===3?'全完成':''}</span></button>`).join('')}</div>
    </div>
    ${hasBonusTasks?`<div class="card bonus-card"><div class="card-label">✦ 加分任務完成幾個？</div>
      <div class="done-selector">${Array.from({length:bonusCount+1},(_,n)=>`<button class="done-btn bonus-done-btn" id="${p}bonusDoneBtn${n}" onclick="${fnB}(${n})">${n}<br><span style="font-size:10px;opacity:0.5">${n===bonusCount?'全完成':''}</span></button>`).join('')}</div>
    </div>`:''}
    <div class="card"><div class="card-label">今天的心情溫度</div>
      <div class="mood-selector">${MOODS.map((m,i)=>`<button class="mood-btn" id="${p}moodBtn${i}" onclick="${fnM}(${i})"><span class="mood-emoji">${m.emoji}</span><span class="mood-label">${m.label}</span></button>`).join('')}</div>
    </div>
    <div class="card gratitude-card"><div class="card-label">🙏 三件感恩的事</div>
      ${[1,2,3].map(i=>`<div class="task-row"><span class="task-num gratitude">${i}</span><input class="task-input gratitude-input" id="${p}gratitude${i}" type="text" placeholder="今天感謝的一件事…" maxlength="50" value="${existing.gratitude&&existing.gratitude[i-1]?existing.gratitude[i-1]:''}"></div>`).join('')}
    </div>
    <div class="card reflect-card"><div class="card-label">🔍 一個檢討</div>
      <textarea class="reflect-ta" id="${p}reflectText" placeholder="今天有什麼可以做得更好？" maxlength="150">${existing.reflection||''}</textarea>
    </div>
    <div class="card closing-card"><div class="card-label">💬 想說的一句話</div>
      <textarea class="closing-ta" id="${p}closingNote" placeholder="對今天、對自己、對明天…" maxlength="150">${existing.closingNote!==undefined?existing.closingNote:''}</textarea>
    </div>
    ${p==='main' && getHabits().length>0 ? `<div class="card" style="border-color:rgba(125,212,168,0.2);background:rgba(125,212,168,0.03);"><div class="card-label" style="color:rgba(125,212,168,0.5);">🌿 今天的習慣</div><div id="nightHabitsArea"></div></div>` : ''}`;
}

function selectDone(n) { selectedDone=n; [0,1,2,3].forEach(i=>{const b=document.getElementById('maindoneBtn'+i);if(b)b.classList.toggle('selected',i===n);}); }
function selectBonusDone(n) { selectedBonusDone=n; for(let i=0;i<=4;i++){const b=document.getElementById('mainbonusDoneBtn'+i);if(b)b.classList.toggle('selected',i===n);} }
function selectMood(n) { selectedMood=n; MOODS.forEach((_,i)=>{const b=document.getElementById('mainmoodBtn'+i);if(b)b.classList.toggle('selected',i===n);}); }

function saveNight() {
  if (selectedDone===null) { showToast('請選完成幾個底線任務 🙂'); return; }
  if (selectedMood===null) { showToast('選一下今天的心情溫度 🙂'); return; }
  const gratitude = [1,2,3].map(i=>document.getElementById('maingratitude'+i).value.trim());
  if (!gratitude.filter(Boolean).length) { showToast('寫一件感恩的事吧 🙏'); return; }
  const reflection = document.getElementById('mainreflectText').value.trim();
  const closingNote = document.getElementById('mainclosingNote').value.trim();
  const today = getTodayKey(); const existing = loadData('day_'+today)||{};
  saveData('day_'+today, { ...existing, done:selectedDone, bonusDone:selectedBonusDone||0, mood:selectedMood, gratitude, reflection, closingNote:closingNote||'', nightTime:new Date().toISOString() });
  showToast('🌙 今日結算完成，好好休息！');
  renderNight();
}

function resetNight() {
  const today=getTodayKey(); const existing=loadData('day_'+today)||{};
  ['done','bonusDone','mood','gratitude','reflection','closingNote','nightTime'].forEach(k=>delete existing[k]);
  saveData('day_'+today, existing); selectedDone=null; selectedBonusDone=null; selectedMood=null; renderNight();
}

// ── Edit Sheet ──
function openEditSheet(dateKey) {
  editingKey=dateKey; editSelectedDone=null; editSelectedBonusDone=null; editSelectedMood=null;
  document.getElementById('sheetTitle').textContent = formatDateLabel(dateKey);
  switchSheetTab('morning');
  renderSheetMorning(dateKey); renderSheetNight(dateKey);
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('editSheet').classList.add('visible');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('editSheet').classList.remove('visible');
  editingKey=null; renderLog();
}
function switchSheetTab(tab) {
  ['morning','night'].forEach(t=>{
    document.getElementById('sheetTab'+t[0].toUpperCase()+t.slice(1)).classList.toggle('active',t===tab);
    document.getElementById('sheet'+t[0].toUpperCase()+t.slice(1)).classList.toggle('visible',t===tab);
  });
}
function renderSheetMorning(dateKey) {
  const existing = loadData('day_'+dateKey)||{};
  document.getElementById('sheetMorning').innerHTML = `
    <div class="card affirm-card"><div class="card-label">💚 肯定</div>

// ── Week Review ──
function renderWeek() {
  const logs = getAllLogs();
  const el = document.getElementById('weekContent');
  if (logs.length < 3) {
    el.innerHTML = `<div style="padding-top:20px;"><div class="empty-log">至少需要幾天的紀錄<br><span style="font-size:12px;">繼續記錄，週回顧會自動出現</span></div></div>`;
    return;
  }
  // Group by week (Mon–Sun)
  const weekMap = {};
  logs.forEach(log => {
    const ws = getWeekStart(log.key);
    if (!weekMap[ws]) weekMap[ws] = [];
    weekMap[ws].push(log);
  });
  const weeks = Object.keys(weekMap).sort().reverse();
  const html = weeks.map(ws => {
    const days = weekMap[ws];
    const withNight = days.filter(d => d.done !== undefined);
    const recorded = days.length;
    const avgDone = withNight.length ? (withNight.reduce((s,d)=>s+d.done,0)/withNight.length).toFixed(1) : '-';
    const moodDays = withNight.filter(d=>d.mood!==undefined);
    const avgMoodIdx = moodDays.length ? Math.round(moodDays.reduce((s,d)=>s+d.mood,0)/moodDays.length) : null;
    // week end date
    const [wy,wm,wd] = ws.split('-').map(Number);
    const weDate = new Date(wy,wm-1,wd+6);
    const weKey = `${weDate.getFullYear()}-${String(weDate.getMonth()+1).padStart(2,'0')}-${String(weDate.getDate()).padStart(2,'0')}`;
    const weekLabel = `${ws.slice(5)} ～ ${weKey.slice(5)}`;
    // mood strip (Mon–Sun)
    const moodStrip = Array.from({length:7},(_,i)=>{
      const d = new Date(wy,wm-1,wd+i);
      const dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const entry = days.find(x=>x.key===dk);
      const dayLabel = ['一','二','三','四','五','六','日'][i];
      const emoji = entry && entry.mood!==undefined ? MOODS[entry.mood].emoji : '·';
      return `<div class="week-mood-cell"><span class="week-mood-emoji">${emoji}</span><span class="week-mood-day">${dayLabel}</span></div>`;
    }).join('');
    // 隨機挑幾則「這週寫下的話」：肯定句 + 給自己的一句話
    const phrases = [];
    days.forEach(d=>{ if(d.affirmation) phrases.push(d.affirmation); if(d.closingNote) phrases.push(d.closingNote); });
    const pickedPhrases = shuffleArr([...new Set(phrases)]).slice(0,3);
    const phrasesHtml = pickedPhrases.map(p=>`<div class="week-affirm-item">「${escapeHtml(p)}」</div>`).join('');
    const wsId = ws.replace(/-/g,'');
    return `<div class="week-card" id="weekCard_${wsId}">
      <div class="week-header" onclick="toggleWeek('${wsId}')">
        <div class="week-label">${weekLabel}</div>
        <div class="week-meta">
          <span class="week-days">${recorded}天</span>
          ${avgMoodIdx!==null?`<span>${MOODS[avgMoodIdx].emoji}</span>`:''}
          <span class="week-arrow">▾</span>
        </div>
      </div>
      <div class="week-body">
        <div class="week-stat-row">
          <div class="week-stat"><div class="week-stat-num" style="color:var(--morning)">${recorded}<span style="font-size:14px;opacity:0.5">/7</span></div><div class="week-stat-label">記錄天數</div></div>
          <div class="week-stat"><div class="week-stat-num" style="color:var(--night)">${avgDone}</div><div class="week-stat-label">平均完成</div></div>
          <div class="week-stat"><div class="week-stat-num" style="font-size:26px;">${avgMoodIdx!==null?MOODS[avgMoodIdx].emoji:'-'}</div><div class="week-stat-label">平均心情</div></div>
        </div>
        <div class="week-section-label">心情走勢</div>
        <div class="week-mood-row">${moodStrip}</div>
        ${phrasesHtml?`<div class="week-section-label">這週寫下的話</div><div class="week-affirm-list">${phrasesHtml}</div>`:''}
        <div class="week-section-label">✨ AI 回饋</div>
        <div id="aiBox_${wsId}">${renderAISection(ws, wsId)}</div>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="hint" style="margin-bottom:16px;">每週自動整理，點開查看詳情</div>${html}`;
}

function toggleWeek(id) {
  document.getElementById('weekCard_'+id).classList.toggle('open');
}

// ── 週回顧 AI 回饋 ──
function shuffleArr(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderAISection(ws, wsId){
  const cached = loadData('aifeedback_'+ws);
  if (cached && cached.text){
    return `<div class="ai-box">${escapeHtml(cached.text)}</div>
      <div class="ai-box-meta">
        <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);">${cached.date?cached.date+' 產生':''}</span>
        <button class="ai-redo" onclick="generateAI('${ws}','${wsId}')">重新產生</button>
      </div>`;
  }
  return `<button class="ai-btn" onclick="generateAI('${ws}','${wsId}')">✨ 產生這週的 AI 回饋</button>`;
}

function summarizeDay(d){
  const [y,m,dd] = d.key.split('-').map(Number);
  return {
    date: d.key,
    weekday: '週'+DAYS_ZH[new Date(y,m-1,dd).getDay()],
    affirmation: d.affirmation||'',
    underlineDone: d.done!==undefined ? d.done : null,
    underlineTotal: d.tasks ? d.tasks.filter(Boolean).length : (d.done!==undefined?3:null),
    bonusDone: d.bonusDone!==undefined ? d.bonusDone : null,
    mood: d.mood!==undefined ? MOODS[d.mood].label : '',
    gratitude: (d.gratitude||[]).filter(Boolean),
    reflection: d.reflection||'',
    closingNote: d.closingNote||''
  };
}
function weekDaysData(ws){
  return getAllLogs().filter(l=>getWeekStart(l.key)===ws).sort((a,b)=>a.key<b.key?-1:1).map(summarizeDay);
}
function buildAIPayload(ws){
  const [y,m,dd] = ws.split('-').map(Number);
  const prev = new Date(y, m-1, dd-7);
  const prevWs = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
  return { weekStart: ws, thisWeek: weekDaysData(ws), prevWeek: weekDaysData(prevWs) };
}

async function generateAI(ws, wsId){
  const box = document.getElementById('aiBox_'+wsId);
  if (!box) return;
  if (!AI_ENDPOINT){ showToast('還沒設定 AI 服務 🛠'); return; }
  box.innerHTML = `<div class="ai-loading">分析中…請稍候 🤔</div>`;
  try {
    const res = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(buildAIPayload(ws))
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const text = data && data.feedback ? String(data.feedback).trim() : '';
    if (!text) throw new Error('空回應');
    saveData('aifeedback_'+ws, { text, date: getTodayKey() });
    box.innerHTML = renderAISection(ws, wsId);
  } catch(e){
    box.innerHTML = `<div class="ai-loading">產生失敗：${escapeHtml(String(e.message||e))}</div>
      <button class="ai-btn" style="margin-top:8px;" onclick="generateAI('${ws}','${wsId}')">再試一次</button>`;
  }
}



// ── Habit System ──
const HABIT_EMOJIS = ['💧','🏃','📚','🧘','💪','🥗','😴','✍️','🎵','🌿','☀️','🧹','💊','🫁','🎯','🚴','🏊','🧠','❤️','🌸'];

function getHabits() { try { return JSON.parse(localStorage.getItem('habits')) || []; } catch { return []; } }
function saveHabits(h) { localStorage.setItem('habits', JSON.stringify(h)); }
function getHabitLog(dateKey) { try { return JSON.parse(localStorage.getItem('habitlog_'+dateKey)) || {}; } catch { return {}; } }
function saveHabitLog(dateKey, log) { localStorage.setItem('habitlog_'+dateKey, JSON.stringify(log)); }

function getWeekDays(weekStart) {
  const [y,m,d] = weekStart.split('-').map(Number);
  return Array.from({length:7}, (_,i) => {
    const dt = new Date(y,m-1,d+i);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  });
}

function getHabitWeekCount(habitId, weekStart) {
  const days = getWeekDays(weekStart);
  return days.filter(dk => {
    const log = getHabitLog(dk);
    return log[habitId];
  }).length;
}

function getHabitStreak(habitId) {
  let streak = 0;
  const today = getTodayKey();
  let d = new Date();
  while (true) {
    const dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const log = getHabitLog(dk);
    if (log[habitId]) { streak++; d.setDate(d.getDate()-1); }
    else break;
    if (streak > 365) break;
  }
  return streak;
}

let selectedHabitEmoji = '💧';
let selectedFreqType = 'daily';

function renderHabit() {
  const habits = getHabits();
  const el = document.getElementById('habitContent');
  const today = getTodayKey();
  const ws = getWeekStart(today);
  const weekDays = getWeekDays(ws);
  const dayLabels = ['一','二','三','四','五','六','日'];

  const habitCards = habits.length === 0
    ? `<div style="text-align:center;color:var(--text-dim);font-size:14px;padding:32px 0 16px;line-height:1.8;">還沒有習慣<br><span style="font-size:12px;">點下方「新增習慣」開始吧</span></div>`
    : habits.map(h => {
      const weekCount = getHabitWeekCount(h.id, ws);
      const target = h.freqType === 'daily' ? 7 : h.freqCount;
      const pct = Math.min(100, Math.round(weekCount / target * 100));
      const streak = getHabitStreak(h.id);
      const dots = weekDays.map((dk, i) => {
        const log = getHabitLog(dk);
        const done = log[h.id];
        const isToday = dk === today;
        const isFuture = dk > today;
        let cls = 'habit-dot';
        if (done) cls += ' done';
        else if (isToday) cls += ' today-dot';
        else if (isFuture) cls += ' future-dot';
        const clickable = !isFuture ? `onclick="toggleHabitDay('${h.id}','${dk}')"` : '';
        return `<div class="${cls}" ${clickable}>${done ? '✓' : dayLabels[i]}</div>`;
      }).join('');
      const freqLabel = h.freqType === 'daily' ? '每天' : `每週 ${h.freqCount} 次`;
      const streakHtml = streak >= 2 ? `<span class="habit-streak">🔥 連續 ${streak} 天</span>` : '';
      return `<div class="habit-card">
        <div class="habit-card-header">
          <span class="habit-emoji-big">${h.emoji}</span>
          <div class="habit-info">
            <div class="habit-name">${h.name}</div>
            <div class="habit-freq-label">${freqLabel}　本週 ${weekCount}/${target}</div>
          </div>
          ${streakHtml}
          <button class="habit-delete" onclick="openEditHabit('${h.id}')" style="opacity:0.5;font-size:14px;">✏️</button>
          <button class="habit-delete" onclick="deleteHabit('${h.id}')">🗑</button>
        </div>
        <div class="habit-week-dots">${dots}</div>
        <div class="habit-progress-row">
          <div class="habit-progress-bar"><div class="habit-progress-fill" style="width:${pct}%"></div></div>
          <div class="habit-progress-text">${pct}%</div>
        </div>
      </div>`;
    }).join('');

  el.innerHTML = `
    <div class="hint" style="margin-bottom:16px;">點格子可以補填或取消打卡 🌿</div>
    ${habitCards}
    <button class="btn btn-habit" onclick="openAddHabit()" style="margin-top:8px;">＋ 新增習慣</button>
    ${habits.length ? `<button class="btn" style="margin-top:10px;background:var(--surface2);color:var(--text-mid);border:1px solid var(--border);" onclick="openHabitHistory()">📅 查看完整紀錄</button>` : ''}
  `;
}

function toggleHabitDay(habitId, dateKey) {
  const log = getHabitLog(dateKey);
  log[habitId] = !log[habitId];
  if (!log[habitId]) delete log[habitId];
  saveHabitLog(dateKey, log);
  renderHabit();
  if (dateKey === getTodayKey()) renderNightHabits();
}

function deleteHabit(habitId) {
  const habits = getHabits().filter(h => h.id !== habitId);
  saveHabits(habits);
  renderHabit();
}

function updateFreqUI() {
  ['daily','weekly'].forEach(t => {
    document.getElementById('freqBtn_'+t).classList.toggle('selected', t===selectedFreqType);
  });
  document.getElementById('freqDetail').classList.toggle('visible', selectedFreqType==='weekly');
}

function saveNewHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) { showToast('請填入習慣名稱 🙂'); return; }
  const freqCount = selectedFreqType === 'weekly' ? (parseInt(document.getElementById('freqCountInput').value) || 3) : 1;
  const habits = getHabits();
  habits.push({
    id: 'h_' + Date.now(),
    name,
    emoji: selectedHabitEmoji,
    freqType: selectedFreqType,
    freqCount,
    createdAt: getTodayKey()
  });
  saveHabits(habits);
  closeAddHabit();
  showToast('✨ 習慣新增成功！');
  renderHabit();
}

function openEditHabit(habitId) {
  const habits = getHabits();
  const h = habits.find(x => x.id === habitId);
  if (!h) return;
  selectedHabitEmoji = h.emoji;
  selectedFreqType = h.freqType;
  document.getElementById('addHabitSheet').classList.add('visible');
  document.getElementById('addHabitOverlay').classList.add('visible');
  renderEmojiPicker();
  updateFreqUI();
  document.getElementById('habitNameInput').value = h.name;
  if (h.freqType === 'weekly') {
    document.getElementById('freqCountInput').value = h.freqCount;
  }
  // Change save button to update mode
  const btn = document.getElementById('addHabitSheet').querySelector('.btn-habit');
  btn.textContent = '更新 🌿';
  btn.onclick = function() { saveEditHabit(habitId); };
  document.getElementById('addHabitSheet').querySelector('div[style*="text-align:center"]').textContent = '編輯習慣';
}

function saveEditHabit(habitId) {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) { showToast('請填入習慣名稱 🙂'); return; }
  const freqCount = selectedFreqType === 'weekly' ? (parseInt(document.getElementById('freqCountInput').value) || 3) : 1;
  const habits = getHabits();
  const idx = habits.findIndex(x => x.id === habitId);
  if (idx === -1) return;
  habits[idx].name = name;
  habits[idx].emoji = selectedHabitEmoji;
  habits[idx].freqType = selectedFreqType;
  habits[idx].freqCount = freqCount;
  saveHabits(habits);
  closeAddHabit();
  showToast('✨ 習慣已更新！');
  renderHabit();
}

function renderNightHabits() {
  const habits = getHabits();
  const el = document.getElementById('nightHabitsArea');
  if (!el || habits.length === 0) return;
  const today = getTodayKey();
  const log = getHabitLog(today);
  el.innerHTML = habits.map(h => {
    const checked = log[h.id];
    return `<div class="night-habit-row">
      <span class="night-habit-emoji">${h.emoji}</span>
      <span class="night-habit-name">${h.name}</span>
      <button class="night-habit-check${checked?' checked':''}" onclick="toggleNightHabit('${h.id}')">
        ${checked ? '✓' : ''}
      </button>
    </div>`;
  }).join('');
}

function toggleNightHabit(habitId) {
  const today = getTodayKey();
  const log = getHabitLog(today);
  log[habitId] = !log[habitId];
  if (!log[habitId]) delete log[habitId];
  saveHabitLog(today, log);
  renderNightHabits();
}

// ── 共用月曆 ──
function dateKeyOf(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// renderCell(dateKey, dayNum, isToday, isFuture) => { cls:'', inner:'' }
function buildCalendar(year, month, renderCell) {
  const first = new Date(year, month-1, 1);
  const startDow = (first.getDay() + 6) % 7; // 週一為 0
  const daysInMonth = new Date(year, month, 0).getDate();
  const today = getTodayKey();
  const dows = ['一','二','三','四','五','六','日'];
  let cells = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = dateKeyOf(year, month, d);
    const isToday = dk === today;
    const isFuture = dk > today;
    const r = renderCell(dk, d, isToday, isFuture) || {};
    cells += `<div class="cal-cell ${r.cls||''}" ${r.onclick||''}>${r.inner!==undefined ? r.inner : d}</div>`;
  }
  return `<div class="cal-grid">${cells}</div>`;
}

// ── 補登記月曆 ──
let pickerYear, pickerMonth;
function openDatePicker() {
  const d = new Date();
  pickerYear = d.getFullYear();
  pickerMonth = d.getMonth() + 1;
  renderDatePicker();
  document.getElementById('datePickerOverlay').classList.add('visible');
  document.getElementById('datePickerSheet').classList.add('visible');
}
function closeDatePicker() {
  document.getElementById('datePickerOverlay').classList.remove('visible');
  document.getElementById('datePickerSheet').classList.remove('visible');
}
function shiftPickerMonth(delta) {
  pickerMonth += delta;
  if (pickerMonth > 12) { pickerMonth = 1; pickerYear++; }
  if (pickerMonth < 1) { pickerMonth = 12; pickerYear--; }
  renderDatePicker();
}
function renderDatePicker() {
  const now = new Date();
  const atCurrentMonth = (pickerYear === now.getFullYear() && pickerMonth === now.getMonth()+1);
  const grid = buildCalendar(pickerYear, pickerMonth, (dk, d, isToday, isFuture) => {
    const has = loadData('day_'+dk);
    let cls = 'pickable';
    if (isFuture) cls = 'future';
    if (isToday) cls += ' today';
    if (has) cls += ' has-record';
    const onclick = isFuture ? '' : `onclick="pickDate('${dk}')"`;
    return { cls, onclick };
  });
  document.getElementById('datePickerCal').innerHTML = `
    <div class="cal-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="shiftPickerMonth(-1)">‹</button>
        <span class="cal-title">${pickerYear} / ${String(pickerMonth).padStart(2,'0')}</span>
        <button class="cal-nav-btn" onclick="shiftPickerMonth(1)" ${atCurrentMonth?'disabled':''}>›</button>
      </div>
      ${grid}
    </div>`;
}
function pickDate(dateKey) {
  closeDatePicker();
  openEditSheet(dateKey);
}

// ── 習慣完整紀錄頁 ──
let habitHistYear, habitHistMonth;
function getFirstHabitLogMonth() {
  // 找出最早的習慣打卡或習慣建立月份
  let earliest = null;
  const habits = getHabits();
  habits.forEach(h => { if (h.createdAt && (!earliest || h.createdAt < earliest)) earliest = h.createdAt; });
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('habitlog_')) {
      const dk = k.replace('habitlog_','');
      if (!earliest || dk < earliest) earliest = dk;
    }
  }
  return earliest;
}
function openHabitHistory() {
  const d = new Date();
  habitHistYear = d.getFullYear();
  habitHistMonth = d.getMonth() + 1;
  document.getElementById('habitSection').classList.remove('visible');
  document.getElementById('habitHistorySection').classList.add('visible');
  document.getElementById('mainHeader').style.display = 'none';
  window.scrollTo(0, 0);
  renderHabitHistory();
}
function closeHabitHistory() {
  document.getElementById('habitHistorySection').classList.remove('visible');
  document.getElementById('habitSection').classList.add('visible');
  document.getElementById('mainHeader').style.display = '';
}
function shiftHabitHistMonth(delta) {
  habitHistMonth += delta;
  if (habitHistMonth > 12) { habitHistMonth = 1; habitHistYear++; }
  if (habitHistMonth < 1) { habitHistMonth = 12; habitHistYear--; }
  renderHabitHistory();
}
function renderHabitHistory() {
  const habits = getHabits();
  const el = document.getElementById('habitHistoryContent');
  const now = new Date();
  const atCurrentMonth = (habitHistYear === now.getFullYear() && habitHistMonth === now.getMonth()+1);
  const earliest = getFirstHabitLogMonth();
  // 是否還能往前(避免無限往前翻到沒資料)
  const prevDisabled = earliest ? (dateKeyOf(habitHistYear, habitHistMonth, 1) <= earliest.slice(0,7)+'-01') : false;

  let monthDoneDays = 0, monthTotalChecks = 0;
  const grid = buildCalendar(habitHistYear, habitHistMonth, (dk, d, isToday, isFuture) => {
    if (isFuture) return { cls: 'future', inner: `<span class="heat-num">${d}</span>` };
    const log = getHabitLog(dk);
    const count = Object.keys(log).filter(id => log[id]).length;
    let cls = '';
    if (count > 0) {
      monthDoneDays++; monthTotalChecks += count;
      if (count === 1) cls = 'heat-1';
      else if (count === 2) cls = 'heat-2';
      else if (count === 3) cls = 'heat-3';
      else cls = 'heat-4';
    }
    if (isToday) cls += ' today';
    // 日期一律顯示；有打卡的日子在右上角加小角標顯示打卡數
    const inner = `<span class="heat-num">${d}</span>${count > 0 ? `<span class="heat-badge">${count}</span>` : ''}`;
    return { cls: cls + ' clickable', inner, onclick: `onclick="openHabitDayEdit('${dk}')"` };
  });

  const legend = `<div class="hp-legend">
    <span>當天打卡數：</span>
    <span class="hp-legend-item"><span class="hp-legend-box" style="background:var(--surface2);border:1px solid var(--border);"></span>0</span>
    <span class="hp-legend-item"><span class="hp-legend-box heat-1"></span>1</span>
    <span class="hp-legend-item"><span class="hp-legend-box heat-2"></span>2</span>
    <span class="hp-legend-item"><span class="hp-legend-box heat-3"></span>3</span>
    <span class="hp-legend-item"><span class="hp-legend-box heat-4"></span>4+</span>
  </div>`;

  const habitListHtml = habits.length
    ? `<div class="card" style="margin-bottom:0;"><div class="card-label">目前追蹤的習慣</div><div class="hp-habit-list">${habits.map(h=>`<div class="hp-habit-line"><span>${h.emoji}</span><span>${h.name}</span></div>`).join('')}</div></div>`
    : '';

  el.innerHTML = `
    <header style="padding:32px 0 8px;">
      <button class="hp-back" onclick="closeHabitHistory()">‹ 返回習慣</button>
      <h1 style="font-size:22px;">習慣完整紀錄 📅</h1>
    </header>
    ${legend}
    <div class="cal-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="shiftHabitHistMonth(-1)" ${prevDisabled?'disabled':''}>‹</button>
        <span class="cal-title">${habitHistYear} / ${String(habitHistMonth).padStart(2,'0')}</span>
        <button class="cal-nav-btn" onclick="shiftHabitHistMonth(1)" ${atCurrentMonth?'disabled':''}>›</button>
      </div>
      ${grid}
      <div class="hp-month-summary">本月 ${monthDoneDays} 天有打卡，共 ${monthTotalChecks} 次</div>
    </div>
    ${habitListHtml}
  `;
}

// ── 習慣歷史補打卡彈窗 ──
function openHabitDayEdit(dateKey) {
  const habits = getHabits();
  if (!habits.length) { showToast('目前沒有習慣可以記錄 🙂'); return; }
  renderHabitDayEditSheet(dateKey);
  document.getElementById('habitDayEditOverlay').classList.add('visible');
  document.getElementById('habitDayEditSheet').classList.add('visible');
}
function closeHabitDayEdit() {
  document.getElementById('habitDayEditOverlay').classList.remove('visible');
  document.getElementById('habitDayEditSheet').classList.remove('visible');
  renderHabitHistory();
}
function renderHabitDayEditSheet(dateKey) {
  const habits = getHabits();
  const log = getHabitLog(dateKey);
  const [y,m,d] = dateKey.split('-');
  const date = new Date(+y, +m-1, +d);
  document.getElementById('habitDayEditTitle').textContent = `${y}/${m}/${d}　週${DAYS_ZH[date.getDay()]}`;
  document.getElementById('habitDayEditList').innerHTML = habits.map(h => {
    const checked = !!log[h.id];
    return `<div class="night-habit-row">
      <span class="night-habit-emoji">${h.emoji}</span>
      <span class="night-habit-name">${h.name}</span>
      <button class="night-habit-check${checked?' checked':''}" onclick="toggleHabitDayCheck('${h.id}','${dateKey}')">
        ${checked ? '✓' : ''}
      </button>
    </div>`;
  }).join('');
}
function toggleHabitDayCheck(habitId, dateKey) {
  const log = getHabitLog(dateKey);
  log[habitId] = !log[habitId];
  if (!log[habitId]) delete log[habitId];
  saveHabitLog(dateKey, log);
  renderHabitDayEditSheet(dateKey);
  if (dateKey === getTodayKey()) { renderNightHabits(); renderHabit(); }
}

document.getElementById('dateLabel').textContent = getFormattedDate();
document.getElementById('pageSubtitle').textContent = '毋須追憶昨日';

renderMorning();
